name: CTA Holiday Bot – Deploy to AWS

on:
  push:
    tags: [ "v*" ]

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25

      - name: Read project version from pom.xml
        id: ver
        run: |
          VERSION=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive org.codehaus.mojo:exec-maven-plugin:3.5.0:exec)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build
        id: package
        run: |
          set -Eeuo pipefail
          mvn -B clean verify
          BUILD_DIR=$(mvn help:evaluate -Dexpression=project.build.directory -q -DforceStdout)
          JAR_FILE=$(ls "${BUILD_DIR}" | grep '.jar$' | grep -v '^original')
          DEPLOY_DIR="${BUILD_DIR}/deployment"
          mkdir -p "$DEPLOY_DIR"
          cp "${BUILD_DIR}/${JAR_FILE}" "${DEPLOY_DIR}/${JAR_FILE}"
          echo "deployment-file=${DEPLOY_DIR}/${JAR_FILE}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to S3
        run: |
          FILE='${{ steps.package.outputs.deployment-file }}'
          aws s3 cp "$FILE" "s3://${{ secrets.S3_BUCKET_NAME }}/${{ github.sha }}.jar"

      - name: Update Lambda from S3
        id: lambda
        run: |
          VERSION=$(aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --s3-bucket "${{ secrets.S3_BUCKET_NAME }}" \
            --s3-key "${{ github.sha }}.jar" \
            --publish \
            --query Version \
            --output text)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Wait for the published version to be active
        run: |
          aws lambda wait published-version-active \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --qualifier "${{ steps.lambda.outputs.version }}"

      - name: Point the live alias at the new version
        run: |
          FUNCTION_NAME="${{ secrets.LAMBDA_FUNCTION_NAME }}"
          VERSION="${{ steps.lambda.outputs.version }}"

          if aws lambda get-alias --function-name "$FUNCTION_NAME" --name live > /dev/null 2>&1; then
            aws lambda update-alias --function-name "$FUNCTION_NAME" --name live --function-version "$VERSION"
          else
            aws lambda create-alias --function-name "$FUNCTION_NAME" --name live --function-version "$VERSION"
          fi

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VER="${{ steps.ver.outputs.version }}"
          awk -v ver="$VER" 'BEGIN { regex="^##[[:space:]]+\\[?" ver "\\]?(\\s*-.*)?$" } $0 ~ regex {flag=1; next} flag && /^##[[:space:]]/ {flag=0} flag' CHANGELOG.md > RELEASE_NOTES.md || true
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No changelog section found for ${VER}." > RELEASE_NOTES.md
          fi
          echo "path=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release using CHANGELOG section
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: cta-holiday-bot ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          overwrite_files: true
          files: |
            ${{ steps.package.outputs.deployment-file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
