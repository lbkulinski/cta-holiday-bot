name: CTA Holiday Bot – Build & Test

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build with Maven
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 25
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package
